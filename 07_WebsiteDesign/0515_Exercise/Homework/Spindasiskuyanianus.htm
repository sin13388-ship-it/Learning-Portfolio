    <dl>
        <dt>蓬萊虎灰蝶</dt>
        <dd>本種為中型灰蝶，具明顯雌雄二型性。體色黑褐，帶淺黃色細環。雄蝶頭部有白斑與白邊，觸角褐色帶白環，口器黑褐，下唇鬚乳黃、覆褐鱗；胸背褐色，腹面乳黃；腹部褐色，有乳黃色帶紋；足部乳黃混褐鱗，跗節帶褐紋，前足跗節癒合、末端尖彎。雌蝶體態與雄蝶相似，但前足跗節不癒合，前翅外緣較凸，翅背無金屬光澤紋。</dd>
