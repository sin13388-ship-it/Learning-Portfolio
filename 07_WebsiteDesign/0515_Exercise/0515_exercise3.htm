<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="utf-8">
    <title>文檔</title>
</head> 
<body>
    <!--0515 html exercise-->
    <!--main, article, header, footer-->
    <!--會根據lable 自動縮排-->
    <header>
        <h1>Fitness</h1>
    </header>
    <main>
        <article>
            <p>People who cannot find time for recreation are obliged sooner or later to find time for illness</p>
        </article>
        <ul>
            <li><time datatime="1979-12-10">Dec 10, 1979</time></li>
            <li><time datetime="10-25">Oct 25th</time></li>
            <li><time datetime="2024W14">14th week of 2026</time></li>
        </ul>
    </main>
    <footer>
        <p>&copy; 幼獅健康關懷中心</p>        
    </footer>
</body>    
   
</html>
