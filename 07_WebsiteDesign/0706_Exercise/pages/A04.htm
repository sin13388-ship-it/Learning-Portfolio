<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap exercise2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /*start with 'col' */
        [class^="col"]{
            border: 1px solid #c2c2c2;
            background-color: #e1e1e1;
            height: 180px;
        }
        .row{
            margin: 10px;
        }

    </style>
</head>
<body>

<div class="container ">
    <div class="row">
        <!--欄位排序-->
        <div class="col-md-4">1</div>
        <div class="col-md-4">2</div>
        <div class="col-md-4">3</div>
        <div class="col-md-4">4</div>
        <div class="col-md-4">5</div>
        <div class="col-md-4">6</div>
    </div>

    <!--
        調整主視覺，讓不同視窗大小下，顯示的排序不同
        order-xx-y, xx 為不同螢幕大小，y 為order
        不同size 可以有不同的order，(order 從0開始)
    --> 
    <div class="row">
        <!--Center-->       
        <div class="col-12 col-md-4 order-md-1">Hello kitty</div>
        <div class="col-12 col-md-4 order-md-4">Doraemon</div>
        <div class="col-12 col-md-4 order-md-0">3</div>
        <div class="col-12 col-md-4 order-md-2">4</div>
        <div class="col-12 col-md-4 order-md-3">5</div>
        <div class="col-12 col-md-4 order-md-5">6</div>
    </div>
    <div class="row">
        <!--Left-->       
        <div class="col-12 col-md-4 order-md-0">Hello kitty</div>
        <div class="col-12 col-md-4 order-md-3">Doraemon</div>
        <div class="col-12 col-md-4 order-md-1">3</div>
        <div class="col-12 col-md-4 order-md-2">4</div>
        <div class="col-12 col-md-4 order-md-4">5</div>
        <div class="col-12 col-md-4 order-md-5">6</div>
    </div>


</div>
<script src ="../../js/bootstrap.bundle.min.js"></script>

</body>
</html>
