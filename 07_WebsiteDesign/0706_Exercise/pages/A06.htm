<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap A06</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /*start with 'col' */
        [class^="col"]{
            border: 1px solid #c2c2c2;
            background-color: #e1e1e1;
            height: 180px;
        }
        .row{
            margin: 10px;
        }

    </style>
</head>
<body>

<div class="container ">
    <!--依照(xs)畫面分成3個欄位，沒有指定螢幕大小都是預設xs  
    -->
    <div class="row row-cols-3">
        <div class="col">1</div>
        <div class="col">2</div>
        <div class="col">3</div>
        <div class="col">4</div>
        <div class="col">5</div>
        <div class="col">6</div>
    </div>
    <!--中等畫面分成3個欄位-->
    <div class="row row-cols-md-3">
        <div class="col">1</div>
        <div class="col">2</div>
        <div class="col">3</div>
        <div class="col">4</div>
        <div class="col">5</div>
        <div class="col">6</div>
    </div>
    <!--依照不同尺寸的畫面，分成指定數量的欄位
    row-cols-1: xs 畫面顯示一個欄位/row
    row-cols-md-2: mid 畫面顯示兩個欄位/row
    row-cols-lg-3: large 畫面顯示三個欄位/row-->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3">
        <div class="col">1</div>
        <div class="col">2</div>
        <div class="col">3</div>
        <div class="col">4</div>
        <div class="col">5</div>
        <div class="col">6</div>
    </div>
</div>
<script src ="../../js/bootstrap.bundle.min.js"></script>

</body>
</html>
