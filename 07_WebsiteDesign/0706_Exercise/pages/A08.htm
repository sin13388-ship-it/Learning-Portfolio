<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap A06</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /*start with 'col' */
        [class^="col"]{
            border: 1px solid #c2c2c2;
            background-color: #e1e1e1;
            height: 180px;
        }
        .row{
            margin: 10px;
        }

    </style>
</head>
<body>

<div class="container-fluid">
    <!--offset 也可以設定螢幕size 套用不同的style-->
    <div class="row">
        <div class="col-12 col-md-4">1</div>
        <div class="col-12 col-md-4">2</div>
        <div class="col-12 col-md-4">3</div>
    </div>
    <div class="row">
        <div class="col-12 col-md-4 col-lg-2">1</div>
        <div class="col-12 col-md-4 col-lg-2">2</div>
        <div class="col-12 col-md-4 col-lg-2">3</div>
    </div>
    <div class="row">
        <div class="col-12 col-md-4 col-lg-2">1</div>
        <div class="col-12 col-md-4 col-lg-2 offset-lg-2">2</div>
        <div class="col-12 col-md-4 col-lg-2 offset-lg-4">3</div>
    </div>
    <div class="row">
        <div class="col-12 col-md-4 col-lg-2 offset-lg-1">1</div>
        <div class="col-12 col-md-4 col-lg-2 offset-lg-2">2</div>
        <div class="col-12 col-md-4 col-lg-2 offset-lg-4">3</div>
    </div>
</div>
<script src ="../../js/bootstrap.bundle.min.js"></script>

</body>
</html>
