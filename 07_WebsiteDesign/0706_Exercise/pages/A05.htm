<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap exercise A05</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /*start with 'col' */
        [class^="col"]{
            border: 1px solid #c2c2c2;
            background-color: #e1e1e1;
            height: 180px;
        }
        .row{
            margin: 10px;
        }

    </style>
</head>
<body>

<div class="container ">
    <!--每列佔兩個欄位-->    
    <div class="row row-cols-2">
        <div class="col">1</div>
        <div class="col">2</div>
        <div class="col">3</div>
        <div class="col">4</div>
        <div class="col">5</div>
        <div class="col">6</div>
    </div>
    <!--每列佔三個欄位-->    
    <div class="row row-cols-md-3">
        <div class="col">1</div>
        <div class="col">2</div>
        <div class="col">3</div>
        <div class="col">4</div>
        <div class="col">5</div>
        <div class="col">6</div>
    </div>
</div>
<script src ="../../js/bootstrap.bundle.min.js"></script>

</body>
</html>
