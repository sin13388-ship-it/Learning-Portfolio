<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap A06</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /*start with 'col' */
        [class^="col"]{
            border: 1px solid #c2c2c2;
            background-color: #e1e1e1;
            height: 180px;
        }
        .row{
            margin: 10px;
        }

    </style>
</head>
<body>

<div class="container-fluid">
    <!--container 與 container-fluid 的差別，
    container-fluid 不管甚麼大小的畫面比例都是100%
    container 則為固定寬度，不同大小的螢幕有各自的固定大小-->
    <div class="row">
        <div class="col-2">1</div>
        <div class="col-2">2</div>
        <div class="col-2">3</div>
    </div>
    <!--欄位間距有不同大小-->
    <div class="row">
        <div class="col-2">1</div>
        <div class="col-2 offset-2">2</div>
        <div class="col-2 offset-4">3</div>
    </div>
    <div class="row">
        <div class="col-2">1</div>
        <div class="col-2 offset-1">2</div>
        <div class="col-2 offset-5">3</div>
    </div>
</div>
<script src ="../../js/bootstrap.bundle.min.js"></script>

</body>
</html>
