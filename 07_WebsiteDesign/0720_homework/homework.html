<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Card Grid</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container my-4">
    <!-- Grid Row -->
    <div class="row row-cols-2 row-cols-md-2 row-cols-lg-4 g-3">
      
      <!-- Card 1 -->
      <div class="col">
        <div class="card h-100 ">
          <img src="./images/photo1.jpg" class="card-img-top" alt="夢幻的樂園">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">夢幻的樂園(一)</h5>
            <p class="card-text text-muted small">迪士尼擴大了其經營範圍，專注於戲劇、音樂及網路媒體！</p>
            <a href="#" class="card-link mt-auto text-decoration-none small">相關連結</a>
          </div>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="col">
        <div class="card h-100">
          <img src="./images/photo2.JPG" class="card-img-top" alt="開闊的景色">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">開闊的景色(二)</h5>
            <p class="card-text text-muted small">心情不好的時候，放下手中的活，看看外面的風景！</p>
            <a href="#" class="card-link mt-auto text-decoration-none small">相關連結</a>
          </div>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="col">
        <div class="card h-100 ">
          <img src="./images/photo3.JPG" class="card-img-top" alt="荷蘭的風車">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">荷蘭的風車(三)</h5>
            <p class="card-text text-muted small">荷蘭鹿特丹和阿姆斯特丹近郊，有很多風車的磨坊和造紙廠！</p>
            <a href="#" class="card-link mt-auto text-decoration-none small">相關連結</a>
          </div>
        </div>
      </div>

      <!-- Card 4 -->
      <div class="col">
        <div class="card h-100 ">
          <img src="./images/photo4.jpg" class="card-img-top" alt="美麗的花朵">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">美麗的花朵(四)</h5>
            <p class="card-text text-muted small">迎風搖曳的小野花在秋天的原野中綻放，令人感到心曠神怡！</p>
            <a href="#" class="card-link mt-auto text-decoration-none small">相關連結</a>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
