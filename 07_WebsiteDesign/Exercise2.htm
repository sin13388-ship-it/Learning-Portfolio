<!DOCTYPE html>
<html lang="zh-tw">
<head>
	<meta charset="utf-8"/>
	<title>HTML exercise</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Rubik+Burned&display=swap" rel="stylesheet">

    <style>
        /* It is cleaner to put styles here */
        h1 {
            font-family: "Rubik Burned", cursive;
            color: black;
            text-align: center;
        }
    </style>
    <style>
  	.code-box {
    	background-color: #f0f0f0; /* 灰色背景 */
    	border: 1px solid #ccc;    /* 邊框 */
    	border-radius: 4px;        /* 圓角 */
    	padding: 2px 4px;          /* 內距 */
    	font-family: monospace;    /* 等寬字型 */
	font-size: 16px;	   /*字形大小*/
  	}
    </style>
</head>
<body>
	<h1>HTML Exercise 2</h1>
	<hr align="center" width="50%"/> 
	<ul>
		<li>這是一個無序清單練習</li>
		<li>射鵰英雄傳</li>
		<li>碧血劍</li>
		<li>天龍八部</li>
	</ul>  
	<ul type="square">
		<li>這是一個無序清單練習，使用方塊作為項目符號</li>
		<li>書劍恩仇錄</li>
		<li>雪山飛狐</li>
		<li>倚天屠龍記</li>
		<li>笑傲江湖</li>
	</ul>
	<hr align="center"/>
	<ol>
		<li>這是一個有序清單的練習</li>
		<li>沖</li>
		<li>脫</li>
		<li>泡</li>
		<li>蓋</li>
		<li>送</li>
	</ol>
	<hr align="center" />
	<ol>
		<li><strong>Q:甚麼是HTML?</strong>
			<ul type="square">
				<li>這是一個有序和無序清單的複合練習</li>				
				<li>A:超文字標記語言，用來建立網頁</li>
			</ul>
		</li>
		<li><strong>Q:甚麼是h1?</strong>
			<ul type="square">
				<li>A:用來將文字設為標題樣式</li>
			</ul>
		</li>
	</ol>

	
</body>
</html>
