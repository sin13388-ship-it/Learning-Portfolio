<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>
        <link rel="stylesheet" href="../CSS_style_class/font_style.css">
        <title>Table</title>
        
    </head>
    <body>
        <table border="1">
             <!--tr = data row-->
            <tr>
                <th>姓名</th>
                <th colspan="2">電話</th>
            </tr>
            <tr>                
               <td>Bill Gates</td>
               <td >555 77 854</td>
              <td >555 77 855</td>
            </tr>
             
        </table>

        <hr/>

        <table border="1">
             <!--tr = data row-->
            <tr>
                <td>姓名</td>
                <td>Bill Gates</td>
            </tr>
            <tr>                
               <td rowspan="2">電話</td>
               <td >555 77 854</td>
            </tr>
            <tr>
                <td >555 77 855</td>
            </tr>
             
        </table>

    </body>
</html>
