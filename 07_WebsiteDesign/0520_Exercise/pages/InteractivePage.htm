<!-- index.html -->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>互動按鈕範例</title>
    <!-- 這裡會引入 CSS -->
     <link rel="stylesheet" href="../CSS_style_class/style.css">
</head>
<body>

    <!-- 用一個 div 當作背景容器，並給它一個 id 叫 background -->
    <div id="background" class="light-theme">
        <h1>點擊下方按鈕切換主題</h1>
        <!-- 建立一顆按鈕，給它一個 id 叫 toggle-btn -->
        <button id="toggle-btn">切換至夜間模式</button>
    </div>

    <!-- 這裡會引入 JavaScript -->
<script src="../Scripts/script.js"></script>
<!-- 注意：<script> 標籤是成對的，必須有結束標籤 </script>，且屬性是 src 不是 href -->
</body>
</html>
