<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>
        <link rel="stylesheet" href="../CSS_style_class/font_style.css">
        <title>Homework0520</title>
        
    </head>
    <body bgcolor="#d0ffee">
        <p align="center"><img  src="../materials/profile1.jpg" ></p>
        <form>           
            
             <fieldset>            
            <!--inline-->
            <legend>用戶個人資料</legend>
            <p>姓&nbsp;&nbsp;名: <input type="text" name="userName" size="30"/></p>            

            <p>性&nbsp;&nbsp;別:</p>
                <input type="radio" name="sex" value="1">男性
                <input type="radio" name="sex" value="0">女性
             <p>最高學歷:
            <select name="Educationalqualifications[]" size="4" >
                <option value="高中以下">高中以下</option>
                <option value="大專院校">大專院校</option>
                <option value="碩士">碩士</option>
                <option value="博士">博士</option> 
                <option value="其他">其他</option>                
            </select></p>
                
             </fieldset>  
             <fieldset >
                <legend style="background-color: #3182ce; color: white;">其他資訊</legend>
                <p>你喜歡下列哪些活動(可複選)?
                 <input type="checkbox" name="userActivity[]" value="閱讀"/><span class="custom-body">閱讀</span>
                 <input type="checkbox" name="userActivity[]" value="打球"/><span class="custom-body">打球</span>
                 <input type="checkbox" name="userActivity[]" value="逛街"/><span class="custom-body">逛街</span>
                 <input type="checkbox" name="userActivity[]" value="聽音樂"/><span class="custom-body">聽音樂</span>
                 <input type="checkbox" name="userActivity[]" value="水上運動"/><span class="custom-body">水上運動</span>
                 <input type="checkbox" name="userActivity[]" value="旅行"/><span class="custom-body">旅行</span></p>
            

            <p>您對於使用臉書經營社群有何看法?</p>
            <textarea name="userFeedback" cols="45" rows="4">
            </textarea> 

             </fieldset>
            <div>
                <input type="submit" value="傳送資料" > 
                <input type="reset" value="清除資料">
            </div>        
        </form> 
  

    </body>
</html>
