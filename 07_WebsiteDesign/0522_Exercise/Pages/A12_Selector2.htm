<!DOCTYPE html>

<html lang="utf-8">
    
    <head>
        <meta charset="utf-8">
        <title>CSS style</title>
         <link rel="stylesheet" href="../CSS_style_class/font_style.css">
       
        <style>
            /*設定格式*/

            .heading{
                font-size: 32px;
                color: #843b62;
                font-weight: bold;
                font-family: 'LXGW WenKai TC',Roboto;
            }
            .content{
                font-size: 24px;
                color: #4d7298;
                font-family: 'LXGW WenKai TC',Roboto;
            }

        </style>
        
    </head>
    <body>
       <h1>詩文欣賞</h1>       
       <p class="heading">春曉</p>
       <p class="content">春眠不覺曉，處處聞啼鳥。夜來風雨聲，花落知多少。</p>
       <p class="heading">竹里館</p>
       <p class="content">獨坐幽篁里，彈琴複長嘯。深林人不知，明月來相照。</p>
    </body>

</html>
