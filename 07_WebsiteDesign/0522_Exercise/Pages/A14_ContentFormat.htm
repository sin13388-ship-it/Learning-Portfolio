<!DOCTYPE html>

<html lang="utf-8">
    
    <head>
        <meta charset="utf-8">
        <title>CSS style</title>
         <link rel="stylesheet" href="../CSS_style_class/font_style.css">
       
        <style>
            /*字型設定*/
            p {
                text-indent: 15px;
                font-family: 'LXGW WenKai TC', 標楷體;
                font-size: large;
                font-style: normal;
            }

            p:hover {
                color: #dc0073;
            }
            

        </style>
        
    </head>
    <body>
       <h1>Contents</h1>
       <p style="font-weight: normal;">Hello world</p>
       <p style="font-weight: bold;">Hello world</p>
       <p style="font-weight: bolder;">Hello world</p>
       <p style="font-weight: 100;">Hello world</p>
       <p style="font-weight: 300;">Hello world</p>
       
       <h2>春曉</h2>
       <p>春眠不覺曉，處處聞啼鳥。</p>
       <p>夜來風雨聲，花落知多少。</p>
       <hr/>
       <!--行高-->
        <h2>春曉</h2>
       <p style="line-height: normal;">春眠不覺曉，處處聞啼鳥。<br/>
       夜來風雨聲，花落知多少。</p>

       <p style="line-height: 1.5;">春眠不覺曉，處處聞啼鳥。<br/>
       夜來風雨聲，花落知多少。</p>

       <p style="line-height: 2;">春眠不覺曉，處處聞啼鳥。<br/>
       夜來風雨聲，花落知多少。</p>
   
       <p style="text-decoration: underline;">春眠不覺曉，處處聞啼鳥。<br/>
       夜來風雨聲，花落知多少。</p>

       <p style="text-decoration: overline;"><br/>
       夜來風雨聲，花落知多少。</p>

        <p style="text-decoration: line-through;"><br/>
       夜來風雨聲，花落知多少。</p>
        <p style="text-decoration: underline wavy;"><br/>
        夜來風雨聲，花落知多少。</p>

      
    </body>

</html>
