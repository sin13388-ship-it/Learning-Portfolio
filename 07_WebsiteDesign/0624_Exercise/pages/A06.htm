<!DOCTYPE html>

<html lang="utf-8">
    
    <head>          
        <meta charset="utf-8">
        <title>Background</title>
        <link rel="stylesheet" href="../CSS_style_class/font_style.css">       
        <style>
            table{
                border-width: 2px;
                border-style: solid;
                /*border-collapse: collapse;*/ /*沒有框中框*/
                border-spacing:3px 3px ; /*框中框的間距，水平, 垂直*/
                empty-cells: hide; /*沒有資料的話隱藏起來, show 的話框框還在*/
            }
            th{
                background-color: aqua;
                border: 1px solid green;
            }
            td{
                background-color: aliceblue;
                border: 1px solid red;
                
            }
            caption{
                color: blue;
                font-size: 20px;
                caption-side: bottom; /*可以調整位置*/
            }
        </style>        
    </head>
    <body>
        <table>       
        <caption>幼獅資訊管理書城</caption>
        <thead>        
            <tr>
                <th>店名</th>
                <th>地址</th>
                <th>營業時間</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>天母店</td>
                <td>台北市建國路20號</td>
                <td rowspan="3">09:30-22:00</td>
            </tr>
            <tr>
                <td>大安店</td>
                <td>台北市大安路30號</td>                
            </tr>
            <tr>
                <td>幼獅店</td>
                <td>桃園幼獅路30號</td>              
            </tr>
            <tr>
                <td>新竹店</td>
                <td></td>
                <td>11:00-20:00</td>
            </tr>                
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3" align="center">書聲朗朗，博覽群書</td>
            </tr>
        </tfoot>
        </table>
    </body>
</html>
