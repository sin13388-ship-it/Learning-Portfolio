<!DOCTYPE html>

<html lang="utf-8">
    
    <head>          
        <meta charset="utf-8">
        <title>BorderRadius&Padding</title>
        <link rel="stylesheet" href="../CSS_style_class/font_style.css">       
        <style>
            .h1_boder_solid{
                border-style: solid;
                border-color: black;
                border-width: 3px;
                border-top-right-radius: 20px 10px ;
                border-bottom-left-radius: 20px 10px ;
            }
            .format_a{
                font-size: 38px;
                border: solid 5px;
                border-color: lightblue;
                border-radius: 5px;
                margin-left: 10px;
                border-left-width: 10px;
                border-top-width: 15px;
            }
            .format_b{
                font-size: 38px;
                border: solid 5px;
                border-color: lightpink;
                border-top-color: rgb(141, 130, 238);
                border-bottom-color: rgb(17, 8, 95);
                border-radius: 10px;
                margin-left: 20px;
                border-top-width: 15px;                
            }
            .format_c{
                font-size: 38px;
                border: solid 5px;
                border-color: lightcoral;
                border-radius: 15px;
                margin-left: 40px;
                border-bottom-width: 15px;
                border-top-right-radius: 50px 20px ;
                border-bottom-left-radius: 50px 20px ; 
                border-top-color: hotpink;               
            }
            .format_d {
                font-size: 38px;
                border: solid 10px; /* 四邊統一粗細 */
                border-color: lightpink;
                border-top-color: violet;                
                margin-left: 20px;
            }                         
        </style>        
    </head>
    <body>
        <h1 class="h1_boder_solid">內容簡介</h1>
        <span class="format_d">紅紅的花開滿了</span>
        <span class="format_b">木棉道</span>
        <span class="format_c">長長的街好像在燃燒</span>
       
    </body>
</html>
