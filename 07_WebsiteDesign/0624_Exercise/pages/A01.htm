<!DOCTYPE html>

<html lang="utf-8">
    
    <head>          
        <meta charset="utf-8">
        <title>Background</title>
        <link rel="stylesheet" href="../CSS_style_class/font_style.css">       
        <style>
        </style>

    <body>
        <!--contain 圖片填滿區塊(全螢幕)/ cover 圖片覆蓋全框(全填滿)-->
        <div style="background-image:  url('../images/flower.gif'); 
        background-repeat: no-repeat; background-size: contain;
        border: solid 3px;">
            <h1 >臨江仙</h1>
            <h1 >玉樓春</h1>
        </div>
        <br/><br/>
        <div style="background-image:  url('../images/flower.gif'); 
        background-repeat: no-repeat; background-size: cover;
        border: solid 3px;">
            <h1 >臨江仙</h1>
            <h1 >玉樓春</h1>
        </div>        
    </body>
</html>
