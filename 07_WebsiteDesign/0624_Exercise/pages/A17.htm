<!DOCTYPE html>

<html lang="utf-8">
    
    <head>          
        <meta charset="utf-8">
        <title>position</title>
        <link rel="stylesheet" href="../CSS_style_class/font_style.css">       
        <style>
            span{
                margin: 15px;
                color: blue;
                font-size: 15px;
                position: relative; /*相對位移*/
                top: 8px;
                left: 12px;
            }
            p{
                font-family: 標楷體;
                font-size: 24px;
            }
        </style>        
    </head>
    <body>
        <h1>蝶戀花 </h1>
        
        <p>
            庭院深深深幾許，楊柳堆煙、簾幕無重數; 
            <span>說明: 堆煙意旨楊柳濃密</span>       
        </p>
        <p>
            玉勒雕鞍遊冶處，樓高不見章臺路。 
            <span>說明: 章臺意旨歌妓寄居之所</span>       
        </p>
        <p>
            雨橫風狂三月暮，門掩黃昏、無計留春住;        
        </p>
        <p>
            淚眼問花花不語，亂紅飛過鞦韆去。
            <span>說明: 亂紅飛意旨落花</span>            
        </p>
            

    </body>
</html>
