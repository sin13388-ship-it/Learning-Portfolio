<!DOCTYPE html>

<html lang="utf-8">
    
    <head>          
        <meta charset="utf-8">
        <title>Background</title>
        <link rel="stylesheet" href="../CSS_style_class/font_style.css">       
        <style>
            .h1_boder_dotted{
                border-style: dotted;
                border-color: black;
            }
            .h1_boder_inset{
                border-style: inset;
                border-color: black;
            }
            .h1_boder_double{
                border-style: double;
                border-color: black;
            }
            .h1_boder_solid{
                border-style: solid;
                border-color: black;
                border-width: 10px;
            }
        </style>        
    </head>
    <body>
        <h1 class="h1_boder_dotted">內容簡介</h1>
        <h1 class="h1_boder_inset">內容簡介</h1>
        <h1 class="h1_boder_double">內容簡介</h1>
        <h1 class="h1_boder_solid">內容簡介</h1>
       
    </body>
</html>
