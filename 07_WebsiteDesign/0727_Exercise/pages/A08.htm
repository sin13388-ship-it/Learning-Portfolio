<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">    
    <title>form</title>
    <style>
        .bg1{
            background: linear-gradient(to bottom, bisque, darkseagreen);
        }
        .bg2{
            background-color: darkseagreen;
        }
       
    </style>
</head>
<body>
    <!-- 使用 Bootstrap container 建立響應式容器 -->
    <div class="container">        
        <!-- 表單容器 -->
           <!-- 使用 Bootstrap Grid 系統建立行 -->
           <div class="row">
                <div class="col">
                    <form>
                        <label for="range_1" class="form-label">範圍選項A (0 - 100)</label>
                        <input type="range" class="form-range" name="range_1" id="range_1">
                        <button type="submit">Confirm</button>
                    </form>                    
                </div>
                <div class="col">
                    <form>
                        <label for="range_2" class="form-label">範圍選項B (0 - 100)</label>
                        <input type="range" class="form-range" name="range_2" id="range_2">
                        <button type="submit">Confirm</button>
                    </form>                    
                </div>
           </div>  
    </div>
    <!-- 引入 Bootstrap 的 JavaScript 套件以支援互動元件 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
