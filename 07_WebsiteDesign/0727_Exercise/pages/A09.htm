<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">    
    <title>form</title>
    <style>
        .bg1{
            background: linear-gradient(to bottom, bisque, darkseagreen);
        }
        .bg2{
            background-color: darkseagreen;
        }
       
    </style>
</head>
<body>
    <!-- 使用 Bootstrap container 建立響應式容器 -->
    <div class="container">        
        <!-- 表單容器 -->
           <!-- 使用 Bootstrap Grid 系統建立行 -->
           <div class="row">
                <div class="col">
                    <div class="dropdown">
                        <button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown">News</button>
                        <ul class="dropdown-menu">
                            <li><h4 class="dropdown-header">國外</h4></li>
                            <li><a href="https://www.bbc.com/news" class="dropdown-item">BBC News</a></li>
                            <li><a href="https://edition.cnn.com/" class="dropdown-item">CNN News</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><h4 class="dropdown-header">國內</h4></li>
                            <li><a href="https://www.tvbs.com.tw/" class="dropdown-item">TVBS</a></li>
                            <li><a href="https://www.ftvnews.com.tw/" class="dropdown-item">民視</a></li>
                        </ul>

                    </div>
                  
                </div>                
           </div>  
    </div>
    <!-- 引入 Bootstrap 的 JavaScript 套件以支援互動元件 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
