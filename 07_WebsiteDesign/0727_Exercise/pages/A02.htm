<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">    
    <title>form</title>
    <style>
        /*start with 'col' */
        [class^="col"]{
            border: 1px solid #c1c1c1;
            background-color: #f1f1f1;
           
        }
    </style>
</head>
<body>
    <div class="container">
        <h3 class="text-center m-3">核選方塊</h3>
        <form >
            <div class="form-check">
                 <label class="form-check-label" for="CK_1">Pikachu</label>   
                 <input class="form-check-input" type="checkbox" value="CK_1" id="CK_1" name="CK_1" checked>
            </div>
            <div class="form-check">
                 <label class="form-check-label" for="CK_2">Charmander</label>   
                 <input class="form-check-input" type="checkbox" value="CK_2" id="CK_2" name="CK_2">
            </div>
            <div class="form-check">
                 <label class="form-check-label" for="CK_3">Bulbasaur</label>   
                 <input class="form-check-input" type="checkbox" value="CK_3" id="CK_3" name="CK_3">
            </div>
            <div class="form-check">
                 <label class="form-check-label" for="CK_4">Squirtle</label>   
                 <input class="form-check-input" type="checkbox" value="CK_4" id="CK_4" name="CK_4">
            </div>
            <div class="form-check">
                 <label class="form-check-label" for="CK_5">Eevee</label>   
                 <input class="form-check-input" type="checkbox" value="CK_5" id="CK_5" name="CK_5" disabled>
            </div>
            <div class="form-check">
                 <label class="form-check-label" for="CK_6">Jigglypuff</label>   
                 <input class="form-check-input" type="checkbox" value="CK_6" id="CK_6" name="CK_6">
            </div>          

        </form>

    </div>
    <script src ="../../js/bootstrap.bundle.min.js"></script>
</body>
</html>
