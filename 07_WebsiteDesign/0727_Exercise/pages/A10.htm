<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">    
    <title>form</title>
    <style>
       
    </style>
</head>
<body>
    <!-- 使用 Bootstrap container 建立響應式容器 -->
    <div class="container">        
        <!-- 表單容器 -->
           <!-- 使用 Bootstrap Grid 系統建立行 -->
           <div class="row">
                <div class="col">
                    <div class="btn-group mt-1">
                        <button type="button" class="btn btn-secondary">機票</button>
                        <button type="button" class="btn btn-secondary">訂房</button>
                        <button type="button" class="btn btn-secondary">團體</button>
                    </div>                  
                </div>
                <div class="col">
                    <div class="btn-group-lg mt-1">
                        <button type="button" class="btn btn-warning">機票</button>
                        <button type="button" class="btn btn-warning">訂房</button>
                        <button type="button" class="btn btn-warning">團體</button>
                    </div>                  
                </div>
                <div class="col">
                    <div class="btn-group btn-group-sm mt-1">
                        <button type="button" class="btn btn-success">機票</button>
                        <button type="button" class="btn btn-success">訂房</button>
                        <button type="button" class="btn btn-success">團體</button>
                    </div>                  
                </div>                
           </div>  
    </div>
    <!-- 引入 Bootstrap 的 JavaScript 套件以支援互動元件 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
