<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">    
    <title>form</title>
    <style>
       
    </style>
</head>
<body>
    <!-- 使用 Bootstrap container 建立響應式容器 -->
    <div class="container">        
        <!-- 表單容器 -->
           <!-- 使用 Bootstrap Grid 系統建立行 -->
           <div class="row">
                <div class="col">
                    <div>
                        <button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#moon">
                            望月懷遠
                        </button></div>
                    <div class="collapse" id="moon">
                        <div class="card card-body">                            
                            <p>海上生明月，天涯共此時。</p>
                            <p>情人怨遙夜，竟夕起相思。</p>
                            <p>滅燭憐光滿，披衣覺露滋。</p>
                            <p>不堪盈手贈，還寢夢佳期。</p>                          
                            
                        </div>
                        <div class="card card-footer bg-info">
                            作者: 張九齡
                        </div>
                    </div>                                                            
                </div>                              
           </div>  
    </div>
    <!-- 引入 Bootstrap 的 JavaScript 套件以支援互動元件 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
