<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">    
    <title>form</title>
    <style>
       
    </style>
</head>
<body>
    <!-- 使用 Bootstrap container 建立響應式容器 -->
    <div class="container">        
        <!-- 表單容器 -->
        <form >           
           <!-- 使用 Bootstrap Grid 系統建立行 -->
           <div class="row">
                <!-- 建立寬度為 4 個欄位的列（佔螢幕寬度 1/3） -->
                <div class="col-4">
                    <!-- Bootstrap 卡片元件，帶有黃色邊框 -->
                    <div class="card border-warning">
                        <!-- 卡片頂部圖片 -->
                        <img src="../images/eevee.png"  alt="Eevee" class="card-img-top">
                        <!-- 卡片主內容區域 -->
                        <div class="card-body">
                            <!-- 卡片標題：寶可夢名稱 -->
                            <div class="card-title">伊布 Eevee</div>                            
                            <!-- 卡片描述文字，pb-2 為下方內邊距 -->
                            <div class="card-text pb-2">伊布是寶可夢中具有多種進化形態的特殊寶可夢，擁有8種不同的進化型態，每種進化都對應不同的屬性能力。</div>
                            <!-- 置中的連結按鈕，連至官方寶可夢圖鑑 -->
                            <div class="text-center">
                                <a href="https://tw.portal-pokemon.com/play/pokedex/0133" class="btn btn-outline-primary btn-sm mb-3">See more</a>
                            </div>
                            <!-- 有序列表，使用 Bootstrap list-group 樣式，展示伊布的 8 種進化形態 -->
                            <ol class="list-group">
                                <li class="list-group-item">水伊布 Vaporeon</li>
                                <li class="list-group-item">雷伊布 Jolteon</li>
                                <li class="list-group-item">火伊布 Flareon</li>
                                <li class="list-group-item">心電伊布 Espeon</li>
                                <li class="list-group-item">月精靈 Umbreon</li>
                                <li class="list-group-item">草伊布 Leafeon</li>
                                <li class="list-group-item">冰伊布 Glaceon</li>
                                <li class="list-group-item">仙子伊布 Sylveon</li>   
                            </ol>
                        </div>
                        <!-- 卡片頁腳 -->
                        <div class="card-footer">
                            <!-- 右對齐的頁腳文字 -->
                            <div class="text-end">Pokemon GO</div>
                        </div>
                    </div>
                </div>
           </div>    
        </form>
    </div>
    <!-- 引入 Bootstrap 的 JavaScript 套件以支援互動元件 -->
    <script src ="../../js/bootstrap.bundle.min.js"></script>
</body>
</html>
