<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 網格作業2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* 整體背景色 */
        body {
            background-color: lightpink;
        }

        /* 卡片共用邊框與背景設定 */
        .custom-card {
            border: 5px solid orange;
            border-radius: 15px;      /* 圓角 */
            background-color: #e9ecef; /* 接近圖中的淺灰色 */
            padding: 20px;
            box-sizing: border-box;
        }

        /* 標題樣式 */
        h2 {
            color: lightslategray;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* 內文樣式 */
        h5 {
            font-family: "DFKai-SB", "BiauKai", "標楷體", sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
        }
    </style>
</head>
<body>

<div class="container ">
    
    <div class="row col-9 gx-4 gy-4 "> 
        
        <div class="col-4 ">

        </div>
        
        <div class="col-4 ">

        </div>

        <div class="col-4 ">
            <div class="custom-card">
                <h2>尋隱者不遇</h2>
                <h5>松下問童子，言師採藥去。<br/>只在此山中，雲深不知處。</h5>
            </div>
        </div>

    </div>

    <div class="row col-9 gx-4 gy-4 "> 
        
        <div class="col-4 ">

        </div>
        
        <div class="col-4 ">
            <div class="custom-card">
                <h2>獨坐敬亭山</h2>
                <h5>眾鳥高飛盡，孤雲獨去閒。<br/>相看兩不厭，只有敬亭山。</h5>
            </div>
        </div>

        <div class="col-4 ">

        </div>

    </div>
    <div class="row col-9 gx-4 gy-4 "> 
        <div class="col-4 ">
            <div class="custom-card">
                <h2>相思</h2>
                <h5>紅豆生南國，春來發幾枝。<br/>願君多採擷，此物最相思。</h5>
            </div>
        </div>
        
        <div class="col-4 ">

        </div>       

        <div class="col-4 ">

        </div>

    </div>
    



</div>

</body>
</html>
