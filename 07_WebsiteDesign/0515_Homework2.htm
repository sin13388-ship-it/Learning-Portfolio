	<h1 style="color:#806517;"><u>苦瓜的健康料理－苦瓜鑲肉</u></h1>
	<p>苦瓜又稱為錦荔枝，因其「實大如鴿子，有皺紋，似荔枝」而得名。</p>	
	<ul>
	<li>材料
		<ol>
			<li type="a">苦瓜</li>
			<li type="a">大白菜</li>
			<li type="a">豬肉絞肉</li>
			<li type="a">太白粉</li>
			<li type="a">鹽</li>
			<li type="a">植物油</li>
		</ol>
	</li>	
	<li>做法</li>
		<ol>
			<li >苦瓜橫切成數塊，然後將內膜和子去除乾淨，使其成中空圈狀。</li>
			<li >鹽漬數分鐘去除苦味。</li>
			<li >將豬肉絞肉鑲進中空圈狀的苦瓜中，然後沾少許的太白粉水，使其黏固。</li>
			<li >用油煎熟，然後加入大白菜及少許水悶煮數分鐘即可。</li>
		</ol>
	<ul>
